<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOBU 生産一覧</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#0d2e3e;--navy2:#15495d;--blue:#1d86b4;--cyan:#31b7c9;
  --paper:#fff;--bg:#eef4f6;--line:#d9e5e9;--ink:#15252d;
  --muted:#687b84;--green:#18875a;--orange:#d77816;--red:#c23e3e;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.header{
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  color:#fff;padding:22px 28px;border-bottom:5px solid #e84a4a;
  display:flex;align-items:center;justify-content:space-between;gap:20px
}
.brand{display:flex;align-items:center;gap:15px}
.logo{
  width:55px;height:55px;border-radius:15px;display:grid;place-items:center;
  font-size:30px;background:linear-gradient(#ff6d5b,#df342f);
  border:2px solid #ffd0ca;box-shadow:0 5px 0 #9e2521
}
.header h1{margin:0;font-size:28px;letter-spacing:.04em}
.header p{margin:5px 0 0;color:#bfe1ea;font-size:14px}
.header-actions{display:flex;gap:9px;flex-wrap:wrap}
button,.file-label{
  border:1px solid #ffffff55;background:#ffffff12;color:#fff;
  padding:10px 14px;border-radius:9px;cursor:pointer;font-weight:700
}
button:hover,.file-label:hover{background:#ffffff25}
.file-label input{display:none}
.main{padding:22px 28px 38px;max-width:1900px;margin:auto}
.notice{
  display:flex;justify-content:space-between;gap:15px;align-items:center;
  padding:12px 16px;margin-bottom:15px;border-radius:10px;
  background:#e6f4fa;border:1px solid #b9ddea;color:#22637d
}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:15px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px;box-shadow:0 3px 10px #1538460c}
.kpi .label{font-size:13px;color:var(--muted);font-weight:700}
.kpi .value{font-size:31px;font-weight:900;margin-top:6px}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:3px}
.filters{
  background:#fff;border:1px solid var(--line);border-radius:13px 13px 0 0;
  padding:13px;display:flex;gap:9px;flex-wrap:wrap
}
.filters input,.filters select{
  border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;
  min-width:160px
}
.filters input{min-width:270px;flex:1}
.panel{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 13px 13px;overflow:hidden}
.table-wrap{overflow:auto;max-height:68vh}
table{border-collapse:collapse;width:100%;min-width:1450px;white-space:nowrap}
th{
  position:sticky;top:0;z-index:2;background:#f3f8fa;color:#4d6671;
  text-align:left;padding:11px 12px;border-bottom:2px solid #cbdde4;font-size:13px
}
td{padding:11px 12px;border-bottom:1px solid #edf2f4;font-size:14px}
tr:hover td{background:#f5fbfd}
.num{text-align:right;font-variant-numeric:tabular-nums}
.code{font-family:Consolas,ui-monospace,monospace;font-weight:700;color:#1c6587}
.qty{font-size:17px;font-weight:900;color:#153f55}
.date{font-weight:700}
.diamond td{color:#d42828;font-weight:800}
.tag{
  display:inline-block;padding:4px 9px;border-radius:999px;background:#e8f4fa;
  color:#216c8c;font-size:12px;font-weight:800
}
.footer{padding:11px 15px;color:var(--muted);font-size:12px;background:#fafcfd}
.empty{text-align:center;padding:50px;color:var(--muted)}
@media(max-width:900px){
  .header{align-items:flex-start;flex-direction:column}
  .main{padding:14px}.kpis{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<header class="header">
  <div class="brand">
    <div class="logo">♨</div>
    <div>
      <h1>DOBU 生産一覧</h1>
      <p>Excel「一覧」シート専用表示</p>
    </div>
  </div>
  <div class="header-actions">
    <label class="file-label">Excelを選択<input id="fileInput" type="file" accept=".xlsx,.xlsm,.xls"></label>
    <button id="reloadBtn">再読込</button>
  </div>
</header>

<main class="main">
  <div class="notice">
    <span id="notice">一覧データを読み込みました。</span>
    <span id="updated"></span>
  </div>

  <section class="kpis">
    <div class="kpi"><div class="label">案件数</div><div class="value" id="kpiJobs">0</div><div class="sub">一覧の明細行</div></div>
    <div class="kpi"><div class="label">合計数量</div><div class="value" id="kpiQty">0</div><div class="sub">数量の合計</div></div>
    <div class="kpi"><div class="label">品名種類</div><div class="value" id="kpiNames">0</div><div class="sub">重複を除外</div></div>
    <div class="kpi"><div class="label">引取り日</div><div class="value" id="kpiPickup">―</div><div class="sub">最も早い日</div></div>
  </section>

  <div class="filters">
    <input id="search" placeholder="品番・品名・得意先・規格を検索">
    <select id="nameFilter"><option value="">すべての品名</option></select>
    <select id="pickupFilter"><option value="">すべての引取り日</option></select>
  </div>

  <section class="panel">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>No</th><th>得意先</th><th>品番</th><th>品名</th>
            <th>厚さ</th><th>縦</th><th>横</th><th>高さ</th>
            <th>規格</th><th>数量</th><th>持ち込み日</th><th>引取り日</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty" hidden>該当データがありません。</div>
    </div>
    <div class="footer"><span id="countText"></span></div>
  </section>
</main>

let allRows = EMBEDDED_ROWS;

const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function excelDate(v){
  if(v instanceof Date) return `${v.getFullYear()}/${String(v.getMonth()+1).padStart(2,"0")}/${String(v.getDate()).padStart(2,"0")}`;
  if(typeof v === "number" && v > 20000){
    const d = new Date(Date.UTC(1899,11,30) + v*86400000);
    return `${d.getUTCFullYear()}/${String(d.getUTCMonth()+1).padStart(2,"0")}/${String(d.getUTCDate()).padStart(2,"0")}`;
  }
  return v ?? "";
}

function normalizeRows(data){
  if(!data || data.length < 2) return [];
  return data.slice(1)
    .filter(r => typeof r[0] === "number" && Number.isFinite(r[0]))
    .map(r => {
      const x = Array.from({length:12},(_,i)=>r[i] ?? "");
      x[10]=excelDate(x[10]); x[11]=excelDate(x[11]);
      return x;
    });
}

function refreshFilters(){
  const names=[...new Set(allRows.map(r=>String(r[3]||"")).filter(Boolean))].sort();
  const picks=[...new Set(allRows.map(r=>String(r[11]||"")).filter(Boolean))].sort();
  $("nameFilter").innerHTML='<option value="">すべての品名</option>'+names.map(x=>`<option>${esc(x)}</option>`).join("");
  $("pickupFilter").innerHTML='<option value="">すべての引取り日</option>'+picks.map(x=>`<option>${esc(x)}</option>`).join("");
}

function render(){
  const q=$("search").value.trim().toLowerCase();
  const nf=$("nameFilter").value;
  const pf=$("pickupFilter").value;
  const rows=allRows.filter(r=>{
    const hay=[r[1],r[2],r[3],r[8]].join(" ").toLowerCase();
    return (!q||hay.includes(q)) && (!nf||r[3]===nf) && (!pf||r[11]===pf);
  });

  $("tbody").innerHTML=rows.map(r=>{
    const diamond=String(r[8]||"").trim().startsWith("◆")?"diamond":"";
    return `<tr class="${diamond}">
      <td class="num">${esc(r[0])}</td>
      <td>${esc(r[1])}</td>
      <td class="code">${esc(r[2])}</td>
      <td><span class="tag">${esc(r[3])}</span></td>
      <td class="num">${esc(r[4])}</td><td class="num">${esc(r[5])}</td>
      <td class="num">${esc(r[6])}</td><td class="num">${esc(r[7])}</td>
      <td>${esc(r[8])}</td><td class="num qty">${esc(r[9])}</td>
      <td class="date">${esc(r[10])}</td><td class="date">${esc(r[11])}</td>
    </tr>`;
  }).join("");

  $("empty").hidden=rows.length>0;
  $("countText").textContent=`${rows.length}件を表示`;
}

function updateKpis(){
  $("kpiJobs").textContent=allRows.length.toLocaleString();
  $("kpiQty").textContent=allRows.reduce((s,r)=>s+(Number(r[9])||0),0).toLocaleString();
  $("kpiNames").textContent=new Set(allRows.map(r=>String(r[3]||"")).filter(Boolean)).size.toLocaleString();
  const dates=allRows.map(r=>String(r[11]||"")).filter(Boolean).sort();
  $("kpiPickup").textContent=dates[0]||"―";
  $("updated").textContent=new Date().toLocaleString("ja-JP");
}

function applyData(rows,msg){
  allRows=rows;
  refreshFilters(); updateKpis(); render();
  $("notice").textContent=msg;
}

async function loadDefault(){
  try{
    const res=await fetch("./ドブ表.xlsm?ts="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const buf=await res.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array",cellDates:false});
    const ws=wb.Sheets["一覧"];
    if(!ws) throw new Error("「一覧」シートがありません");
    const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true});
    const rows=normalizeRows(data);
    if(!rows.length) throw new Error("一覧に明細データがありません");
    applyData(rows,`ドブ表.xlsm の「一覧」から ${rows.length}件を読み込みました。`);
  }catch(e){
    applyData(EMBEDDED_ROWS,`埋め込み済みの「一覧」データ ${EMBEDDED_ROWS.length}件を表示しています。`);
  }
}

$("fileInput").addEventListener("change",async e=>{
  const file=e.target.files[0]; if(!file)return;
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array",cellDates:false});
    const ws=wb.Sheets["一覧"];
    if(!ws) throw new Error("「一覧」シートがありません");
    const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true});
    const rows=normalizeRows(data);
    if(!rows.length) throw new Error("一覧に明細データがありません");
    applyData(rows,`${file.name} の「一覧」から ${rows.length}件を読み込みました。`);
  }catch(err){alert(err.message);}
});
$("reloadBtn").addEventListener("click",loadDefault);
["search","nameFilter","pickupFilter"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",render));

loadDefault();
</script>
</body>
</html>
